<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Lobby</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>

<div class="centered">

<h1>Lobby Options</h1>

<form name="createLobby" id="changeLobbyForm">
    <label for="gameModeSelect">Game Mode: </label>
    <select name="gameMode" id="gameModeSelect">
        <option value="Cards Against Humanity">Cards Against Humanity</option>
        <option value="Uno">Uno</option>
    </select>

    <br><br>

    <label for="maxNumOfPlayersSelect">Number of players: </label>
    <select name="maxNumOfPlayers" id="maxNumOfPlayersSelect">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8" selected>8</option>
    </select>

    <br><br>

    <label for="lobbyPasswordInputField">Lobby Password (For open lobby, leave blank): </label>
    <input name="lobbyPassword" type="password" id="lobbyPasswordInputField" placeholder="Enter a lobby password">

    <br><br>

    <input type="submit">
</form>

    <br><br>
    <!-- <button id="submitButton">Create/Change Lobby</button> -->
    <!-- <button id="startGameButton">Start Game</button> -->
    <form action="/api/startGame" method="post">
        <input type="submit" value="Start Game">
    </form>
</div>

<script src="../js/createLobby.js"></script>

</body>
</html>
