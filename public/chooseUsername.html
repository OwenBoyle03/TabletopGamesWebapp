<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Board Games</title>
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>

<div class="centered">

    <h1>Board Games</h1>

    <br><br>

    <h2>Choose a username:</h2>
        <form name="usernameInput">
            <input name="username" type="text" id="usernameInputField" placeholder="Enter your username">
            <input type="submit" hidden>
        </form>

</div>

</body>

<script>
    const submitButton = document.getElementById("usernameSubmitButton");
    submitButton.addEventListener("click", () => {
        const username = document.getElementById("usernameInputField").value;
        window.location.href = "/chooseGame/" + username;
    });
</script>

</html>
